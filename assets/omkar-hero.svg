
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="880" height="420"
     viewBox="0 0 880 420"
     role="img"
     aria-labelledby="title desc">

<title id="title">Omkar Mutal — Full-Stack Developer</title>
<desc id="desc">Animated developer profile banner with portrait and portfolio link.</desc>

<style>
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes drawUnderline {
  0% {
    stroke-dashoffset: 380;
    opacity: .35;
  }
  45% {
    stroke-dashoffset: 0;
    opacity: 1;
  }
  80% {
    stroke-dashoffset: 0;
    opacity: 1;
  }
  100% {
    stroke-dashoffset: -380;
    opacity: .35;
  }
}

/* Portrait entrance */
@keyframes portraitReveal {
  0% {
    opacity: 0;
    transform: translateY(24px) scale(.92);
  }
  70% {
    opacity: 1;
    transform: translateY(-3px) scale(1.01);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Gentle floating zoom */
@keyframes portraitFloat {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.025);
  }
}

.r {
  opacity: 1;
  animation: rise .75s cubic-bezier(.2,.7,.2,1) both;
}

.f {
  opacity: 1;
  animation: fade .8s ease-out both;
}

.shine {
  stroke-dasharray: 380;
  stroke-dashoffset: 380;
  animation: drawUnderline 4.5s ease-in-out infinite;
}

.portrait-reveal {
  opacity: 1;
  transform-box: fill-box;
  transform-origin: center;
  animation: portraitReveal 1.3s cubic-bezier(.2,.7,.2,1) .35s both;
}

.portrait-float {
  transform-box: fill-box;
  transform-origin: center;
  animation: portraitFloat 7s ease-in-out 1.8s infinite;
}

@media(prefers-reduced-motion:reduce) {
  .r, .f {
    opacity: 1;
    animation: none;
  }

  .shine {
    display: none;
  }

  .portrait-reveal,
  .portrait-float {
    opacity: 1;
    animation: none;
    transform: none;
  }
}
</style>

<!-- Background -->
<rect width="880" height="420" rx="13" fill="#f3f3f1"/>

<!-- Header -->
<g class="f" style="animation-delay:.05s">
  <rect x="48" y="49" width="8" height="8"
        rx="2" fill="#2f55ff"/>

  <text x="66" y="57"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="12"
        letter-spacing="1"
        fill="#6e6e73">
    FULL-STACK DEVELOPER
  </text>

  <text x="70" y="80"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="12"
        letter-spacing="1"
        fill="#6e6e73">
    Heyy Dev's !!!
  </text>
</g>

<!-- Name -->
<text class="r" style="animation-delay:.14s"
      x="44" y="190"
      font-family="'Instrument Serif',Georgia,serif"
      font-size="116"
      letter-spacing="-2.5"
      fill="#111111">
  Omkar
</text>

<text class="r" style="animation-delay:.29s"
      x="44" y="290"
      font-family="'Instrument Serif',Georgia,serif"
      font-style="italic"
      font-size="108"
      letter-spacing="-3"
      fill="#111111">
  Mutal
</text>

<!-- Animated Blue Reveal -->
<defs>
  <mask id="nameBlueWipe"
        maskUnits="userSpaceOnUse"
        x="35" y="65" width="430" height="245">

    <rect x="35" y="65" width="0" height="245" fill="#fff">
      <animate attributeName="width"
               values="0;430;430;0"
               keyTimes="0;0.48;0.78;1"
               dur="6s"
               repeatCount="indefinite"/>
    </rect>
  </mask>
</defs>

<g mask="url(#nameBlueWipe)" fill="#2f55ff">
  <text x="44" y="190"
        font-family="'Instrument Serif',Georgia,serif"
        font-size="116"
        letter-spacing="-2.5">
    Omkar
  </text>

  <text x="44" y="290"
        font-family="'Instrument Serif',Georgia,serif"
        font-style="italic"
        font-size="108"
        letter-spacing="-3">
    Mutal
  </text>
</g>

<!-- Animated Underline -->
<path class="shine"
      d="M48 300 H413"
      fill="none"
      stroke="#2f55ff"
      stroke-width="2.5"
      stroke-linecap="round"/>

<!-- Description -->
<g class="r" style="animation-delay:.52s">
  <text x="48" y="338"
        font-family="Arial,Helvetica,sans-serif"
        font-size="18"
        fill="#3a3a3c">
    I build full-stack applications and AI-powered products,
  </text>

  <text x="48" y="365"
        font-family="Arial,Helvetica,sans-serif"
        font-size="18"
        fill="#3a3a3c">
    turning ideas into useful software.
  </text>
</g>

<!-- Clickable Portfolio -->
<a xlink:href="https://dev-omkar-portfolio.vercel.app/"
   target="_blank">

  <g class="f" style="animation-delay:.8s">

    <rect x="43" y="375"
          width="310" height="32"
          rx="5" fill="transparent"/>

    <text x="48" y="396"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="13"
          fill="#111111">
      Omkar's Portfolio
    </text>

    <text x="175" y="396"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="13"
          fill="#2f55ff">
      &#8599;
    </text>

  </g>
</a>

<!-- Portrait Clip -->
<defs>
  <clipPath id="portraitClip">
    <rect x="520" y="55"
          width="320" height="330"
          rx="10"/>
  </clipPath>
</defs>

<!-- Animated Portrait -->
<g class="portrait-reveal">

  <g class="portrait-float">

    <image xlink:href="./images/omkar-photo.png"
           x="520" y="55"
           width="320" height="330"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#portraitClip)"/>

  </g>

</g>

</svg>
