
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="30"
     height="75"
     viewBox="850 119 30 75"
     role="img"
     aria-labelledby="title">

  <title id="title">Connect With Me — Omkar Mutal</title>

  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3975F6"/>
      <stop offset="100%" stop-color="#78A2FF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
                    flood-color="#252525" flood-opacity=".07"/>
    </filter>


<style>
600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

  .bg {
    fill: #f3f3f1;
  }

  .card {
    fill: #ffffff;
    stroke: #e4e4e1;
    stroke-width: 1;
  }

  /* Editorial heading */
  .heading {
    fill: #202124;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 35px;
    font-weight: 600;
    letter-spacing: -.5px;
  }

  /* Small section label */
  .eyebrow {
    fill: #3975F6;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
  }

  /* Supporting text */
  .description {
    fill: #777873;
    font-family: 'Manrope', Arial, sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .1px;
  }

  /* Social card titles */
  .social-label {
    fill: #202124;
    font-family: 'Manrope', Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
  }

  /* Social card subtitles */
  .social-handle {
    fill: #858680;
    font-family: 'Manrope', Arial, sans-serif;
    font-size: 9px;
    font-weight: 500;
  }

  /* Footer */
  .footer {
    fill: #969791;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .8px;
  }

  .social-card {
    fill: #f8f8f6;
    stroke: #e8e8e5;
    stroke-width: 1;
    transition: fill .25s ease, stroke .25s ease;
  }

  .social-card:hover {
    fill: #edf3ff;
    stroke: #3975F6;
  }

  .icon-bg {
    fill: #3975F6;
  }

  .icon {
    fill: #ffffff;
  }

  .pulse {
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
  }

  .line {
    stroke-dasharray: 110;
    stroke-dashoffset: 110;
    animation: draw 2s ease forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  .float {
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
</style>

  </defs>

  <!-- Background -->
  <rect class="bg" width="880" height="235" rx="14"/>

  <!-- Card -->
  <rect class="card"
        x="1" y="1"
        width="878" height="233"
        rx="13"
        filter="url(#shadow)"/>

  <!-- Accent -->
  <rect x="30" y="0" width="90" height="3"
        rx="2" fill="url(#blueGradient)"/>

  <!-- Heading -->
  <text class="eyebrow" x="31" y="34">
    LET'S CONNECT
