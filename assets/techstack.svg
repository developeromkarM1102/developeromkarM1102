
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="880" height="420"
     viewBox="0 0 880 420"
     role="img"
     aria-labelledby="title desc">

<title id="title">Omkar's Technology Stack</title>
<desc id="desc">Twenty-four technology logos arranged in three animated circular orbits.</desc>

<style>
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes pulse {
  0%,100% { opacity: .75; }
  50% { opacity: 1; }
}

@keyframes dash {
  to { stroke-dashoffset: -100; }
}

.bg {
  fill: #f3f3f1;
}

.orbit {
  fill: none;
  stroke-width: 1;
  stroke-dasharray: 3 7;
  transform-origin: 440px 218px;
}

.inner-orbit {
  stroke: #2f55ff;
  animation: spin 38s linear infinite;
}

.middle-orbit {
  stroke: #F28C28;
  animation: spinReverse 55s linear infinite;
}

.outer-orbit {
  stroke: #20A464;
  animation: spin 75s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes spinReverse {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

.tech-orbit-inner {
  transform-origin: 440px 218px;
  animation: spin 38s linear infinite;
}

.tech-orbit-middle {
  transform-origin: 440px 218px;
  animation: spinReverse 55s linear infinite;
}

.tech-orbit-outer {
  transform-origin: 440px 218px;
  animation: spin 75s linear infinite;
}

.tech-icon {
  opacity: 1;
  animation: fadeIn .8s ease-out forwards;
}

.tech-icon use {
  overflow: visible;
}

.center-pulse {
  transform-box: fill-box;
  transform-origin: center;
  animation: pulse 3s ease-in-out infinite;
}

.center-ring {
  fill: none;
  stroke: #2f55ff;
  stroke-width: 1.5;
  stroke-dasharray: 8 5;
  animation: dash 8s linear infinite;
}

.particle {
  animation: pulse 2s ease-in-out infinite;
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation: none !important;
  }
  .tech-icon {
    opacity: 1;
  }
}
</style>

