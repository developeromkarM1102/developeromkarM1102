
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="880"
     height="290"
     viewBox="0 0 880 290"
     role="img"
     aria-labelledby="title">

  <title id="title">GitHub Contributions — Omkar Mutal</title>

  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3975F6"/>
      <stop offset="100%" stop-color="#78A2FF"/>
    </linearGradient>

    <linearGradient id="scanGradient">
      <stop offset="0%" stop-color="#3975F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3975F6" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#3975F6" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="snakeClip">
      <rect x="24" y="105" width="832" height="150" rx="8"/>
    </clipPath>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7"
                    flood-color="#252525" flood-opacity=".07"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #f3f3f1; }
    .card { fill: #ffffff; stroke: #e4e4e1; stroke-width: 1; }

    .heading {
      fill: #202124;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 27px;
      font-weight: 400;
    }

    .eyebrow {
      fill: #3975F6;
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .description {
      fill: #777873;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .3px;
    }

    .footer {
      fill: #969791;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 1.2px;
    }

    .snake-light { display: inline; }
    .snake-dark { display: none; }

    .blue-line {
      stroke-dasharray: 110;
      stroke-dashoffset: 110;
      animation: drawLine 2s ease forwards;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    .scan {
      animation: scan 6s linear infinite;
    }

    @keyframes scan {
      from { transform: translateX(-900px); }
      to { transform: translateX(900px); }
    }

    .accent-dot {
      animation: dotPulse 2.5s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="880" height="290" rx="14"/>

  <!-- Main card -->
  <rect class="card"
        x="1" y="1"
        width="878" height="288"
        rx="13"
        filter="url(#softShadow)"/>

  <!-- Accent -->
  <rect x="30" y="0" width="90" height="3"
        rx="2" fill="url(#blueGradient)"/>

  <!-- Header -->
  <text class="eyebrow" x="31" y="34">
    CONTRIBUTIONS
  </text>

  <text class="heading" x="30" y="69">
    Building, one commit at a time.
  </text>

  <path class="blue-line"
        d="M31 80 H153"
        fill="none"
        stroke="#3975F6"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <text class="description" x="31" y="98">
    A visual record of consistency, curiosity and continuous learning.
  </text>

  <!-- Activity indicator -->
  <g transform="translate(760 36)">
    <circle cx="0" cy="0" r="4" fill="#3975F6" class="accent-dot"/>
    <text x="11" y="4"
          font-family="Arial, sans-serif"
          font-size="9"
          fill="#777873"
          letter-spacing="1">
      GITHUB ACTIVITY
    </text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="111" x2="850" y2="111"
        stroke="#e8e8e5" stroke-width="1"/>

  <!-- Larger contribution snake -->
  <g clip-path="url(#snakeClip)">

    <image class="snake-light"
           x="24" y="105"
           width="832" height="150"
           preserveAspectRatio="xMidYMid meet"
           href="https://raw.githubusercontent.com/developeromkarM1102/developeromkarM1102/output/github-contribution-grid-snake.svg"
           xlink:href="https://raw.githubusercontent.com/developeromkarM1102/developeromkarM1102/output/github-contribution-grid-snake.svg"/>

    <image class="snake-dark"
           x="24" y="105"
           width="832" height="150"
           preserveAspectRatio="xMidYMid meet"
           href="https://raw.githubusercontent.com/developeromkarM1102/developeromkarM1102/output/github-contribution-grid-snake-dark.svg"
           xlink:href="https://raw.githubusercontent.com/developeromkarM1102/developeromkarM1102/output/github-contribution-grid-snake-dark.svg"/>

    <rect class="scan"
          x="0" y="105"
          width="160" height="150"
          fill="url(#scanGradient)"/>
  </g>

  <!-- Footer -->
  <line x1="30" y1="263" x2="850" y2="263"
        stroke="#e8e8e5" stroke-width="1"/>

  <text class="footer" x="31" y="281">
    DEVELOPER OMKAR 
  </text>

  <text class="footer" x="849" y="281" text-anchor="end">
    CONSISTENCY OVER PERFECTION
  </text>

</svg>
